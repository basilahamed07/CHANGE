# India — country strategy (7th country, added 2026-09-28)
# Schema is validated by app/country_registry.py. Drop-in YAML = ZERO code
# changes (M3 design). The location classifier (location_classifier.py)
# already maps every city below -> "India", so classification/eligibility/
# strategy work the moment this file is loaded.
code: IN
name: India
region: India   # canonical classifier string (jobs.location_region stores this)
enabled: true

# Alias strings the location classifier should map to this country.
# Must include the exact region string the classifier emits.
aliases: [india, bharat]
cities:
- bengaluru
- bangalore
- mumbai
- hyderabad
- pune
- chennai
- delhi
- new delhi
- noida
- gurgaon
- gurugram
- kolkata
- ahmedabad

# Allowed work arrangements for this country.
work_types:
  remote: true
  hybrid: true
  onsite: true

# Visa/sponsorship reality: India is a DOMESTIC market — jobs here do not
# mention sponsorship. requires_sponsorship: false keeps the hybrid matcher's
# NO_SPONSORSHIP_STATED hard-blocker from firing on Indian listings.
visa:
  requires_sponsorship: false
  sponsorship_keywords: []

# Salary floor for eligibility (overrides global settings.min_salary).
# INR annual floor for a senior AI/ML role (rule of thumb, not a policy bar).
salary:
  currency: INR
  min: 1800000

# Country-specific job search terms (M4 discovery: countries x terms x adapters).
search:
  extra_terms:
  - AI engineer
  - machine learning engineer
  - generative AI
  - LLM engineer
  - python developer
